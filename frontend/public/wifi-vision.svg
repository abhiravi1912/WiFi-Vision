<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="16" fill="url(#bg-grad)"/>
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="0.5" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="wave-grad" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E0E7FF"/>
    </linearGradient>
  </defs>

  <!-- Wi-Fi Waves forming Vision Iris -->
  <path d="M 12 24 C 22 12, 42 12, 52 24" stroke="url(#wave-grad)" stroke-width="4.5" stroke-linecap="round" opacity="0.95"/>
  <path d="M 19 32 C 27 23, 37 23, 45 32" stroke="url(#wave-grad)" stroke-width="4.5" stroke-linecap="round" opacity="0.85"/>
  <path d="M 25 39 C 29 34, 35 34, 39 39" stroke="url(#wave-grad)" stroke-width="4.5" stroke-linecap="round" opacity="0.75"/>

  <!-- Core Sensing Node -->
  <circle cx="32" cy="45" r="4.5" fill="url(#wave-grad)"/>

  <!-- Radar Guideline Ring -->
  <circle cx="32" cy="34" r="26" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.18" stroke-dasharray="4 4"/>
</svg>
